<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Bryan Kim Calipes’s projects, skills, and background through an interactive portfolio.">
  <title>Bryan Kim Calipes | Chat Portfolio</title>
  <script>
    try {
      const saved = localStorage.getItem('bryan-portfolio-theme');
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
        ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/script.jsx"></script>
</body>
</html>
